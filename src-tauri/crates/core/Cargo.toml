[package]
name = "tnls-core"
version = "0.1.0"
edition = "2021"
description = "Pure domain logic for the tnls SSH tunnel manager (no Tauri dependency)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
